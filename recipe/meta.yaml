{% set version = "1.3.4" %}

package:
  name: cython-blis
  version: {{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/b/blis/blis-{{ version }}.tar.gz
    sha256: c125acd77ccf0184f476b6a599f9819727e19ed311904ed3281118a3d06082d9
  # The tests import blis_tests_common, which the 1.3.4 sdist leaves out.
  - url: https://raw.githubusercontent.com/explosion/cython-blis/release-v{{ version }}/tests/blis_tests_common.py
    sha256: 0ad2abfbca0cf8bfdb1025dbe6a335790c46440e5d4557fe02a18fba4cd63013
    folder: tests

build:
  number: 0
  # if you care about ppc, please debug the failures
  skip: true  # [ppc64le]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    # cannot use clang 19+ due to https://github.com/llvm/llvm-project/pull/92883; see #67
    - clangdev <19  # [win]
  host:
    - python
    - pip
    - cython
    - setuptools
    - numpy
    - wheel
  run:
    - python

test:
  source_files:
    - tests
  requires:
    - pytest
    - hypothesis
  imports:
    - blis
    - blis.py
    - blis.cy
  commands:
    # 1.3.4 no longer ships the tests inside the blis package, so
    # --pyargs blis collects nothing.
    - pytest --tb=native tests

about:
  home: http://github.com/explosion/cython-blis
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE
    - blis/LICENSE
  summary: Fast matrix-multiplication as a self-contained Python library – no system dependencies!

  doc_url: https://github.com/explosion/cython-blis
  dev_url: https://github.com/explosion/cython-blis

extra:
  recipe-maintainers:
    - conda-forge/spacy
